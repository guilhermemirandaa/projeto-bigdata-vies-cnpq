name: ETL CNPq

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python etl/ingestao.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
