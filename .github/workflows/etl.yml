# Roda o ETL em lote: manualmente (botão "Run workflow") ou todo dia 1º do mês.
# A senha do banco vem do GitHub Secret DATABASE_URL, nunca do código.
name: ETL CNPq

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"

jobs:
  etl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python etl/ingestao.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
